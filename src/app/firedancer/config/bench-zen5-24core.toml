# Bench config for an AMD EPYC 9275F (Zen5) 24-core / 48-thread machine.

# Event tile defaults to an https:// reporter URL. 
# Disable telemetry for local bench.
telemetry = false

[layout]
  net_tile_count = 1
  quic_tile_count = 1
  resolv_tile_count = 1
  verify_tile_count = 8
  gossvf_tile_count = 1
  execle_tile_count = 1
  execrp_tile_count = 1
  shred_tile_count = 1
  sign_tile_count = 2

[development.genesis]
  fund_initial_accounts = 32768

[development.bench]
  # Over-provision generators vs verify so each verify tile sees a
  # backlog (needed for FD_BATCH_VERIFY to fill >1).
  benchg_tile_count = 12
  benchs_tile_count = 4
  larger_max_cost_per_block = true
  larger_shred_limits_per_block = true

[tiles.shred]
  max_pending_shred_sets = 16384

[tiles.pack]
  schedule_strategy = "perf"

[tiles.gui]
  enabled = false
